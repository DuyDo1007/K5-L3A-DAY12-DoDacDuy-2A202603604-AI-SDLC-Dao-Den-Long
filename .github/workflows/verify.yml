name: CI Verification

on:
  push:
    branches: [ main ]
    tags: [ 'phase-*', 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Unit & Scenario Tests
        run: npm test

      - name: Verify Phase 1 Contract & Determinism
        run: node scripts/verify_phase.js --phase 1
